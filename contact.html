
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Build Hub | Contact</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar md:navbar-expand bg-1 border-bottom">
        <div class="container">
            <a class="navbar-brand" href="index.html">PC Build Hub</a>

            <button class="btn navbar-toggler" type="button"
                data-bs-toggle="drawer" data-bs-target="#navDrawer"
                aria-label="Open navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <dialog class="drawer drawer-end" id="navDrawer"
                aria-labelledby="drawerTitle">

                <div class="drawer-header">
                    <p class="drawer-title" id="drawerTitle">Menu</p>
                    <button type="button" class="btn-close"
                        data-bs-dismiss="drawer" aria-label="Close">
                    </button>
                </div>

                <div class="drawer-body">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#components">Components</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page"
                                href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>

            </dialog>
        </div>
    </nav>

    <main class="container py-5">

        <h1>Contact Us</h1>
        <p>Have questions about building your PC? Send us a message using the form below.</p>

        <form class="mt-4" action="#" method="get">

            <div class="row g-4">

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="firstName">First Name</label>
                        <input type="text" class="form-control"
                            id="firstName" name="firstName" required>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="lastName">Last Name</label>
                        <input type="text" class="form-control"
                            id="lastName" name="lastName" required>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="email">Email Address</label>
                        <input type="email" class="form-control"
                            id="email" name="email"
                            placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="topic">Topic</label>
                        <select class="form-control" id="topic" name="topic" required>
                            <option value="">Choose a topic</option>
                            <option value="building">Building a PC</option>
                            <option value="compatibility">Component Compatibility</option>
                            <option value="upgrades">Hardware Upgrades</option>
                            <option value="other">Other Questions</option>
                        </select>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="message">Message</label>
                        <textarea class="form-control" id="message"
                            name="message" rows="5" required></textarea>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="consent">
                            <input type="checkbox" class="check"
                                id="consent" name="consent" required>
                            I agree to be contacted regarding my message.
                        </label>
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn-solid theme-primary">
                        Submit Message
                    </button>
                </div>

            </div>

        </form>

    </main>

    <footer class="bg-1 border-top text-center py-4 mt-5">
        <p class="mb-0">&copy; 2026 PC Build Hub. All rights reserved.</p>
    </footer>

    <script type="module" src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
